name: cloud-update

on:
  workflow_dispatch:
  schedule:
    - cron: '25 1 * * 1-5'
    - cron: '30 3 * * 1-5'
    - cron: '0 9 * * 1-5'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cloud update
        shell: pwsh
        run: python cloud/run_update.py
        env:
          PYTHONUTF8: '1'

      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name "cloud-update"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "cloud update [skip ci]"
            git push
          }
