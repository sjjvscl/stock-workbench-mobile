  .sortbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .amt-hot{color:#e8590c;font-weight:800;font-size:13.5px}
  .auc-tno{color:#5f3dc4;font-weight:800;font-size:13.5px}
  .rtable tr:last-child td{border-bottom:none}
  .rr-role{font-weight:700;width:1%}
  .rr-leader .rr-role{color:var(--up)}
  .rr-mid .rr-role{color:var(--accent)}
  .rr-leader{background:#fff7f6}
  .rr-mid{background:#f6f9ff}
  .ev-card .rr-orphan .rr-role{color:#8a919c;font-weight:400}

  .rr-name{font-weight:700}
  .rr-cap{font-size:12px}
  .cap-l{color:#722ed1}.cap-m{color:var(--accent)}.cap-s{color:var(--muted)}
  .up{color:var(--up);font-weight:700}
  .down{color:var(--down);font-weight:700}
  .muted{color:var(--muted)}
  .tag{display:inline-block;background:#f0f1f4;border-radius:4px;padding:0 4px;font-size:10px;color:#5a616c;margin-left:3px;vertical-align:1px}
  .tag-fanbao{background:#fff1f0;color:#cf1322}
  .tag-ths{background:#f0f5ff;color:#2f54eb;margin-left:0;margin-right:3px}
  .tag-ths-ev{background:#f0f1f4;color:#a0a6b0}
  .rr-ths{white-space:normal;line-height:1.7}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  footer{font-size:11px;color:var(--muted);text-align:center;padding:14px 0 22px}
</style>

<script>
(function(){
"use strict";
var WRAP = null;
try{ WRAP = JSON.parse(document.getElementById("auctionData").textContent); }
catch(e){ document.getElementById("roles").innerHTML = '<div class="empty">页面数据损坏</div>'; return; }
var DATES = (WRAP && WRAP.dates) ? WRAP.dates : [];
var DEFAULT_DATE = (WRAP && WRAP.default) ? WRAP.default : (DATES[0]||"");
var SEL = DEFAULT_DATE;
var P = (WRAP && WRAP.payloads) ? (WRAP.payloads[SEL] || {}) : {};   // 当前选中的日 payload
var IS_THS = (P.mode === "ths");
var MODES = IS_THS ? (P.modes || {}) : null;
var activeMode = IS_THS ? (P.default || Object.keys(MODES)[0]) : "kpl";
var GROUPS = IS_THS ? [] : (P.groups || []);
var DEFAULT_SORT = "first";
var sortMode = {};
var merged = false;
var tries = 0;
var WEEK = ["日","一","二","三","四","五","六"];

function isPremiumDay(){ return SEL === DEFAULT_DATE; }   // 仅默认（最新）日有 premium.json 回填
// 该日 payload 是否已自带溢价（部分历史日的数据文件在被回填时写回了 next_premium，
// 选中这类历史日时卡片会直接显示真实溢价，状态行就不能再说「未回填」）
function hasPremium(payload){
  if(!payload) return false;
  if(!IS_THS){
    var gs = payload.groups || [];
    for(var i=0;i<gs.length;i++){
      var g = gs[i];
      for(var j=0;j<g.items.length;j++){ if(g.items[j].premium != null) return true; }
    }
    return false;
  }
  var ms = payload.modes || {};
  for(var k in ms){
    var md = ms[k];
    var lists = [md.groups || [], md.events || []];
    if(md.leftover) lists.push([md.leftover]);
    for(var a=0;a<lists.length;a++){
      var arr = lists[a];
      for(var b=0;b<arr.length;b++){
        var g2 = arr[b];
        for(var c=0;c<(g2.items ? g2.items.length : 0);c++){
          if(g2.items[c].premium != null) return true;
        }
      }
    }
  }
  return false;
}
function fmt(x, d){
  if(x==null || isNaN(x)) return "—";
  var v = Number(x);
  return v.toFixed(d==null?2:d);
}
function weekdayOf(s){
  try{ return "周" + WEEK[new Date(s + "T00:00:00").getDay()]; }catch(e){ return ""; }
}
function hmNow(){
  var n = new Date();
  return n.getHours()*10000 + n.getMinutes()*100 + n.getSeconds();
}
function today8(){
  var n = new Date();
  return "" + n.getFullYear() + ("0"+(n.getMonth()+1)).slice(-2) + ("0"+n.getDate()).slice(-2);
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function curModeObj(){
  if(!IS_THS) return {label:"开盘啦口径", groups:GROUPS, events:[], leftover:null};
  var m = MODES[activeMode] || {};
  return {label:m.label||"", groups:m.groups||[], events:m.events||[], leftover:m.leftover||null};
}
function forEachItem(cb){
  if(!IS_THS){
    GROUPS.forEach(function(g){ g.items.forEach(cb); });
    return;
  }
  Object.keys(MODES).forEach(function(k){
    var m = MODES[k];
    (m.groups||[]).forEach(function(g){ g.items.forEach(cb); });
    (m.events||[]).forEach(function(g){ g.items.forEach(cb); });
    if(m.leftover) m.leftover.items.forEach(cb);
  });
}

/* ---------- 导航与视图切换 ---------- */
function renderNav(){
  var nav = P.nav || {};
  var parts = [];
  Object.keys(nav).forEach(function(k){
    var cur = (k === (IS_THS ? "ths" : "kpl"));
    parts.push('<a href="' + esc(nav[k].href) + '" class="' + (cur ? "cur" : "") + '">'
      + esc(nav[k].label) + (cur ? "（当前）" : "") + "</a>");
  });
  document.getElementById("navlinks").innerHTML = parts.join("");
}
function renderModeSwitch(){
  var box = document.getElementById("modeswitch");
  var hint = document.getElementById("hint");
  if(!IS_THS){ box.style.display = "none"; hint.innerHTML = ""; return; }
  box.style.display = "flex";
  var keys = Object.keys(MODES);
  box.innerHTML = '<span class="muted">分组视图</span>' + keys.map(function(k){
    return '<button type="button" class="modebtn' + (k === activeMode ? " active" : "")
      + '" data-mode="' + esc(k) + '">' + esc((MODES[k]||{}).label || k) + "</button>";
  }).join("");
  hint.innerHTML = "同花顺口径：一只票有 3~4 个题材标签，会出现在多个组里，组内家数按标签计数（组间重复计入）。"
    + "事件/属性类标签单列在下方，不混进题材。";
}

/* ---------- 状态行 ---------- */
function setStatus(extra){
  var el = document.getElementById("status");
  var hm = hmNow();
  var isT1 = (today8() === String(P.t1||""));
  var parts = [];
  parts.push("<span>数据日 <b>" + esc(P.date) + "（" + weekdayOf(P.date) + "）</b></span>");
  parts.push("<span>涨停 <b>" + (P.limit_up||P.total||"—") + "</b> 只</span>");
  if(IS_THS) parts.push("<span>" + esc(curModeObj().label) + "</span>");
  if(merged){
    parts.push('<span class="pill pill-ok">溢价已更新 ' + merged.at + (merged.via?(" · "+merged.via):"") + "</span>");
  }else if(!isPremiumDay()){
    var hp = hasPremium(P);
    parts.push('<span class="pill ' + (hp ? "pill-ok" : "pill-hist") + '">'
      + (hp ? "历史日 · 溢价已含" : "历史日 · 溢价未回填") + "</span>");
  }else if(isT1 && hm < 92503){
    parts.push('<span class="pill pill-ing">竞价进行中，09:25 后自动填溢价</span>');
  }else{
    parts.push('<span class="pill pill-wait">待' + esc(P.next_day||"T+1") + ' 竞价' + (tries?(" · 已尝试 "+tries+" 次"):"") + "</span>");
  }
  if(extra) parts.push("<span>" + extra + "</span>");
  el.innerHTML = parts.join("");
}

/* ---------- 渲染 ---------- */
function premiumHtml(p){
  if(p==null){
    if(isPremiumDay()) return '<span class="muted" style="font-size:11px">待' + esc(P.next_day||"T+1") + "</span>";
    return '<span class="muted" style="font-size:11px">—</span>';
  }
  var pct = p*100;
  return '<b class="' + (p>=0?"up":"down") + '">' + (p>=0?"+":"") + fmt(pct,1) + "%</b>";
}
function rowHtml(it, role){
  var tags = (it.tags||[]).map(function(c){
    return '<span class="tag' + (c==="反包"?" tag-fanbao":"") + '">' + esc(c) + "</span>";
  }).join("");
  var ths = (it.ths||[]).map(function(t){
    return '<span class="tag tag-ths' + (t.ev?" tag-ths-ev":"") + '">' + esc(t.t) + "</span>";
  }).join("") || '<span class="muted" style="font-size:11px">—</span>';
  var roleTxt = role==="leader" ? "龙头" : (role==="mid" ? "中军"
    : (role==="orphan" ? '<span class="muted" style="font-size:11px">' + esc(it.orp||"其他") + "</span>" : "小弟"));
  var cap = it.lscap || 0;
  var capCls = !cap ? "cap-s" : (cap>=300?"cap-l":(cap>=100?"cap-m":"cap-s"));
  return '<tr class="rr-' + role + '">'
    + '<td class="rr-role">' + roleTxt + "</td>"
    + '<td class="rr-code">' + esc(it.code) + "</td>"
    + '<td class="rr-name">' + esc(it.name) + tags + "</td>"
    + '<td class="rr-bl">' + esc(it.bl||"") + "</td>"
    + "<td>" + esc(it.first||"—") + "</td>"
    + "<td>" + (it.fengdan?fmt(it.fengdan,2):"—") + "</td>"
    + "<td>" + (it.amount ? (it.amount >= 10 ? '<b class="amt-hot">' + fmt(it.amount,1) + "</b>" : fmt(it.amount,1)) : "—") + "</td>"
    + '<td class="rr-cap ' + capCls + '">' + (cap?Math.round(cap)+"亿":"—") + "</td>"
    + "<td>" + (it.auc_turnover!=null ? '<b class="auc-tno">' + fmt(it.auc_turnover,1) + "%</b>" : "—") + "</td>"
    + "<td>" + premiumHtml(it.premium) + "</td>"
    + '<td class="rr-ths">' + ths + "</td></tr>";
}
function sortItems(items, mode){
  var arr = (items||[]).slice();
  if(mode === "first"){
    arr.sort(function(a,b){
      var af = String(a.first||"99:99:99"), bf = String(b.first||"99:99:99");
      if(af !== bf) return af < bf ? -1 : 1;
      return (b.fengdan||0)-(a.fengdan||0);
    });
  }else if(mode === "premium"){
    arr.sort(function(a,b){
      var ap = (a.premium==null?-Infinity:a.premium), bp = (b.premium==null?-Infinity:b.premium);
      if(bp !== ap) return bp - ap;
      return (b.fengdan||0)-(a.fengdan||0);
    });
  }else if(mode === "lbc"){
    /* 连板高度降序。同高度再按首封早（连板梯队里先封的是龙头位），
       首封也相同再比封单。与「首封」口径不同：那个是纯时间序、
       会把 2 板排在 8 板前面；这个是高度序，专治「低位板刷在最上面」。 */
    arr.sort(function(a,b){
      var al = (a.lbc==null?0:a.lbc), bl = (b.lbc==null?0:b.lbc);
      if(bl !== al) return bl - al;
      var af = String(a.first||"99:99:99"), bf = String(b.first||"99:99:99");
      if(af !== bf) return af < bf ? -1 : 1;
      return (b.fengdan||0)-(a.fengdan||0);
    });
  }else if(mode === "amount"){
    arr.sort(function(a,b){
      var aa = (a.amount||0), ba = (b.amount||0);
      if(ba !== aa) return ba - aa;
      return (b.fengdan||0)-(a.fengdan||0);
    });
  }
  return arr;                         // mode==="role"：保持 Python 侧的角色行序
}
function cardHtml(g){
  var mode = sortMode[g.name] || DEFAULT_SORT;
  var items = sortItems(g.items, mode);
  var rows = items.map(function(it){ return rowHtml(it, it.role); }).join("");
  var avgHtml = "";
  var ps = (g.items||[]).filter(function(it){ return it.premium!=null; });
  if(ps.length){
    var avg = ps.reduce(function(m,it){ return m + it.premium; }, 0) / ps.length;
    avgHtml = ' <span class="avg ' + (avg>=0?"up":"down") + '">均溢价 ' + (avg>=0?"+":"") + fmt(avg*100,1) + "%</span>";
  }
  var midTxt = (g.mids && g.mids.length) ? g.mids.join("、") : "无";
  var headMeta = g.orphan
    ? "共 " + g.count + " 只 ｜ 各自的" + (g.orphanLabel||"板块") + "当天只有它一只涨停，进不了正常分组"
    : "龙头 " + esc(g.leaderName||"") + ' ｜ 中军 <b class="rl-mid">' + (g.mids||[]).length + "只</b>（" + esc(midTxt) + "）";
  return '<div class="role-card' + (g.ev ? " ev-card" : "") + '"><div class="role-head">'
    + "<b>" + esc(g.name) + '</b><span class="role-cnt">' + g.count + " 只</span>" + avgHtml
    + '<span class="muted">' + headMeta + "</span>"
    + '<span class="sortbtns"><span class="sortbtn-label">按</span>'
    + '<button type="button" class="sortbtn' + (mode==="role"?" active":"") + '" data-g="' + esc(g.name) + '" data-m="role">角色</button>'
    + '<button type="button" class="sortbtn' + (mode==="first"?" active":"") + '" data-g="' + esc(g.name) + '" data-m="first">首封</button>'
    + '<button type="button" class="sortbtn' + (mode==="lbc"?" active":"") + '" data-g="' + esc(g.name) + '" data-m="lbc" title="按连板高度排：高位板在前，同高度按首封早">连板</button>'
    + '<button type="button" class="sortbtn' + (mode==="amount"?" active":"") + '" data-g="' + esc(g.name) + '" data-m="amount">成交</button>'
    + '<button type="button" class="sortbtn' + (mode==="premium"?" active":"") + '" data-g="' + esc(g.name) + '" data-m="premium">溢价</button>'
    + "</span></div>"
    + '<div style="overflow-x:auto"><table class="rtable"><thead><tr>'
    + "<th>" + (g.orphan?(g.orphanLabel||"标签"):"角色") + "</th><th>代码</th><th>名称</th><th>连板</th><th>首封</th>"
    + "<th>封单(亿)</th><th>成交额(亿)</th><th>流通市值(亿)</th><th>竞价换手%</th><th>次日溢价</th><th>同花顺题材</th>"
    + "</tr></thead><tbody>" + rows + "</tbody></table></div></div>";
}
function leftoverHtml(lf){
  // 落单卡没有角色列，但仍然跟随默认行序（现在的默认是首封），否则一张卡破坏整页一致性
  var rows = sortItems(lf.items, DEFAULT_SORT).map(function(it){ return rowHtml(it, "orphan"); }).join("");
  return '<div class="role-card ev-card"><div class="role-head">'
    + "<b>其余（标签只出现 1 次）</b>"
    + '<span class="role-cnt">' + lf.count + " 只</span>"
    + '<span class="muted">这些票的题材标签当天没有第二只票跟上，各自的标签见行首与末列</span>'
    + '</div><div style="overflow-x:auto"><table class="rtable"><thead><tr>'
    + "<th>标签</th><th>代码</th><th>名称</th><th>连板</th><th>首封</th>"
    + "<th>封单(亿)</th><th>成交额(亿)</th><th>流通市值(亿)</th><th>竞价换手%</th><th>次日溢价</th><th>同花顺题材</th>"
    + "</tr></thead><tbody>" + rows + "</tbody></table></div></div>";
}
function render(){
  var box = document.getElementById("roles");
  var m = curModeObj();
  if(!m.groups.length && !m.events.length && !m.leftover){ box.innerHTML = '<div class="empty">暂无题材角色数据</div>'; return; }
  var html = m.groups.map(cardHtml).join("");
  if(m.events.length){
    html += '<div class="sect-title">事件/属性类标签（同花顺也把它们算作「涨停原因」，但不是题材）</div>'
      + m.events.map(function(g){ g.ev = true; return cardHtml(g); }).join("");
  }
  if(m.leftover) html += leftoverHtml(m.leftover);
  box.innerHTML = html;
  document.getElementById("foot").textContent =
    "页面构建 " + (P.build||"") + " ｜ 分组口径 " + (P.group_src||"")
    + (IS_THS ? (" ｜ THEME_RULES " + (P.rule_count||0) + " 条（自 v2_template 现场提取）") : "")
    + " ｜ 溢价来源 premium.json（GitHub API 直读，失败退同源）";
}

/* ---------- 溢价拉取与合并 ---------- */
var API_URL = "https://api.github.com/repos/sjjvscl/stock-workbench-mobile/contents/premium.json?ref=main";
function fetchWithTimeout(url, opt, ms){
  return new Promise(function(resolve, reject){
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var timer = setTimeout(function(){ if(ctl) ctl.abort(); reject(new Error("timeout")); }, ms||8000);
    var o = opt || {};
    if(ctl) o.signal = ctl.signal;
    fetch(url, o).then(function(r){
      clearTimeout(timer); resolve(r);
    }, function(e){ clearTimeout(timer); reject(e); });
  });
}
function fetchPremium(){
  // 通道 1：GitHub contents API raw（近实时，push 后几秒内可读；未认证限流 60 次/小时，失败只变慢）
  return fetchWithTimeout(API_URL, {headers:{Accept:"application/vnd.github.raw"}, cache:"no-store"}, 8000)
    .then(function(r){
      if(!r.ok) throw new Error("api " + r.status);
      return r.json().then(function(d){ if(d && d.items) return {d:d, via:"API"}; throw new Error("api bad"); });
    })
    .catch(function(){
      // 通道 2：同源 Pages（要等 Pages 构建，约 40~60 秒）
      return fetchWithTimeout("premium.json?_=" + Date.now(), {cache:"no-store"}, 8000)
        .then(function(r){
          if(!r.ok) throw new Error("pages " + r.status);
          return r.json().then(function(d){ if(d && d.items) return {d:d, via:"Pages"}; throw new Error("pages bad"); });
        });
    });
}
function staleReload(remoteT){
  // 侧车已是更新交易日，说明本页 HTML 是旧的（晚间没重建或缓存）→ 带时间戳重载一次
  try{
    var k = "wb_auction_stale_" + remoteT;
    if(sessionStorage.getItem(k)) return;
    sessionStorage.setItem(k, "1");
    location.replace(location.pathname + "?_wb=" + remoteT);
  }catch(e){}
}
function tryMerge(res){
  if(!res || !res.d || !res.d.items) return false;
  var d = res.d;
  if(String(d.t||"") !== String(P.t||"")){
    if(String(d.t||"") > String(P.t||"")) staleReload(String(d.t));
    return false;
  }
  var n = 0, na = 0;
  forEachItem(function(it){
    var rec = d.items[it.code];
    if(!rec) return;
    if(rec.premium != null){ it.premium = rec.premium; n++; }
    // 竞价换手（2026-09-30）：侧车带上 auc_turnover 就当场回填，不必等当晚重建内置。
    // 侧车只给竞价额(万)时，用 流通市值(亿) 现场折算，口径与 build_auction.py 一致。
    if(rec.auc_turnover != null){
      it.auc_turnover = rec.auc_turnover; na++;
    } else if(rec.auc_amount_wan && it.lscap){
      it.auc_turnover = Math.round(rec.auc_amount_wan / 10000.0 / it.lscap * 100.0 * 100) / 100;
      na++;
    }
  });
  var tm = new Date();
  merged = {at: ("0"+tm.getHours()).slice(-2) + ":" + ("0"+tm.getMinutes()).slice(-2) + ":" + ("0"+tm.getSeconds()).slice(-2),
            via: res.via, n: n, na: na};
  return true;
}
function poll(){
  if(!isPremiumDay()) return;     // 历史日无 premium.json 回填，跳过轮询
  if(merged) return;
  tries++;
  fetchPremium().then(function(res){
    if(tryMerge(res)){ render(); setStatus(); return; }
    schedule();
  }, function(){ schedule(); });
  setStatus();
}
function schedule(){
  if(!isPremiumDay()) return;
  if(merged) return;
  // 只在 T+1 当天 09:31:30 前密集轮询；其余时间（盘后打开）再懒试几次就够
  var isT1 = (today8() === String(P.t1||""));
  var hm = hmNow();
  var deadline = isT1 ? 93130 : 235959;
  var maxTries = isT1 ? 80 : 6;      // 09:25~09:31 约 5s 一次；盘后最多 6 次
  if(hm <= deadline && tries < maxTries) setTimeout(poll, 5000);
  else setStatus('溢价拉取未完成 <span class="pill pill-bad">通道异常</span>，显示内嵌数据');
}

/* ---------- 日期选择器 ---------- */
function fillDates(){
  var box = document.getElementById("datesel");
  if(!box) return;
  DATES.forEach(function(d8){
    var o = document.createElement("option");
    o.value = d8;
    var dt = d8.replace(/^(\d{4})(\d{2})(\d{2})$/, "$1-$2-$3");
    o.textContent = dt + " " + weekdayOf(dt) + (d8 === DEFAULT_DATE ? "（最新）" : "");
    if(d8 === SEL) o.selected = true;
    box.appendChild(o);
  });
  box.addEventListener("change", function(){ selectDate(box.value); });
}
function selectDate(date8){
  if(!WRAP.payloads || !WRAP.payloads[date8] || date8 === SEL) return;
  SEL = date8;
  P = WRAP.payloads[date8] || {};
  IS_THS = (P.mode === "ths");
  MODES = IS_THS ? (P.modes || {}) : null;
  activeMode = IS_THS ? (P.default || Object.keys(MODES)[0]) : "kpl";
  GROUPS = IS_THS ? [] : (P.groups || []);
  sortMode = {};
  merged = false;
  tries = 0;
  var box = document.getElementById("datesel");
  if(box) box.value = SEL;
  renderNav();
  renderModeSwitch();
  render();
  setStatus();
  if(isPremiumDay()) poll();     // 切回最新日时重新尝试拉溢价
}

document.addEventListener("click", function(ev){
  var b = ev.target;
  if(b && b.classList && b.classList.contains("sortbtn")){
    var g = b.getAttribute("data-g"), m = b.getAttribute("data-m");
    sortMode[g] = m;          // 直接切换，点哪个就按哪个排（默认首封，见 DEFAULT_SORT）
    render();
  }
});
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && !merged && isPremiumDay()) poll();
});

renderNav();
renderModeSwitch();
// 支持 ?d=YYYYMMDD 直达历史日（分享链接 / 无头测试用）；非法或缺省回默认日
(function(){
  try{
    var q = new URLSearchParams(location.search).get("d");
    if(q && WRAP.payloads && WRAP.payloads[q]){
      SEL = q;
      P = WRAP.payloads[q];
      IS_THS = (P.mode === "ths");
      MODES = IS_THS ? (P.modes || {}) : null;
      activeMode = IS_THS ? (P.default || Object.keys(MODES)[0]) : "kpl";
      GROUPS = IS_THS ? [] : (P.groups || []);
      renderNav();
      renderModeSwitch();
    }
  }catch(e){}
})();
render();
setStatus();
fillDates();
if(isPremiumDay()) poll();
// 视图切换（同花顺口径）：切换后保留已合并的溢价，直接重渲染
document.getElementById("modeswitch").addEventListener("click", function(ev){
  var b = ev.target;
  if(b && b.classList && b.classList.contains("modebtn")){
    activeMode = b.getAttribute("data-mode");
    renderModeSwitch();
    render();
    setStatus();
  }
});
})();
</script>
